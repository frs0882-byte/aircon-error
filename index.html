<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="空調エラー即引き">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700;800;900&family=JetBrains+Mono:wght@700;800;900&display=swap" rel="stylesheet">
  <title>HVAC エラーコード即引きツール | 現場特化型</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-dark">
  <!-- オープニングスプラッシュ（1+2 融合ハイブリッドアニメーション） -->
  <div id="app-splash" class="app-splash anim-fusion" role="presentation">
    <div class="splash-mesh-bg"></div>
    <div class="splash-blue-aura"></div>
    <div class="splash-pulse-ring splash-pulse-1"></div>
    <div class="splash-pulse-ring splash-pulse-2"></div>

    <div class="splash-hero-box">
      <svg class="splash-hero-svg" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sp-bgPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#191d26"/>
            <stop offset="50%" stop-color="#0d1015"/>
            <stop offset="100%" stop-color="#07090d"/>
          </linearGradient>
          <linearGradient id="sp-titaniumBevel" x1="15%" y1="0%" x2="85%" y2="100%">
            <stop offset="0%" stop-color="#eef2f7"/>
            <stop offset="25%" stop-color="#8b95a5"/>
            <stop offset="55%" stop-color="#3c4352"/>
            <stop offset="85%" stop-color="#7c8798"/>
            <stop offset="100%" stop-color="#222630"/>
          </linearGradient>
          <linearGradient id="sp-brushedMetal" x1="0%" y1="0%" x2="100%" y2="15%">
            <stop offset="0%" stop-color="#485060"/>
            <stop offset="22%" stop-color="#9ca6b8"/>
            <stop offset="48%" stop-color="#cfd6e3"/>
            <stop offset="75%" stop-color="#7a8496"/>
            <stop offset="100%" stop-color="#343b48"/>
          </linearGradient>
          <linearGradient id="sp-innerChassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2e3442"/>
            <stop offset="50%" stop-color="#171b23"/>
            <stop offset="100%" stop-color="#262b38"/>
          </linearGradient>
          <radialGradient id="sp-coolantBlueGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#70e4ff" stop-opacity="1"/>
            <stop offset="38%" stop-color="#00b4ff" stop-opacity="0.75"/>
            <stop offset="70%" stop-color="#0055aa" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#001a33" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="sp-errFlameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fff3b0"/>
            <stop offset="35%" stop-color="#ffb703"/>
            <stop offset="75%" stop-color="#ff7a00"/>
            <stop offset="100%" stop-color="#e84a00"/>
          </linearGradient>
          <linearGradient id="sp-sheenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
            <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
          <filter id="sp-neonOrangeGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="8" result="blur1"/>
            <feGaussianBlur stdDeviation="20" result="blur2"/>
            <feMerge>
              <feMergeNode in="blur2"/>
              <feMergeNode in="blur1"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
          <filter id="sp-dropShadowHeavy" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.85"/>
          </filter>
          <pattern id="sp-iconDotsPattern" width="12" height="12" patternUnits="userSpaceOnUse">
            <circle cx="6" cy="6" r="1.4" fill="#000000" opacity="0.55"/>
          </pattern>
          <pattern id="sp-hairlinePattern" width="8" height="3" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="8" y2="0" stroke="#ffffff" stroke-width="0.6" opacity="0.1"/>
            <line x1="0" y1="1.5" x2="8" y2="1.5" stroke="#000000" stroke-width="0.6" opacity="0.12"/>
          </pattern>
          <pattern id="sp-knurlPattern" width="6" height="6" patternUnits="userSpaceOnUse">
            <path d="M 0 0 L 6 6 M 6 0 L 0 6" stroke="#181b22" stroke-width="1.3"/>
          </pattern>
          <clipPath id="sp-hexClip">
            <polygon points="256,42 448,148 448,364 256,470 64,364 64,148"/>
          </clipPath>
        </defs>

        <!-- 台座 -->
        <rect x="16" y="16" width="480" height="480" rx="106" fill="url(#sp-bgPlateGrad)"/>
        <rect x="16" y="16" width="480" height="480" rx="106" fill="url(#sp-iconDotsPattern)"/>

        <!-- 外周オレンジ枠 -->
        <rect class="sp-outer-frame" x="28" y="28" width="456" height="456" rx="96"
              fill="none" stroke="#ff7a00" stroke-width="11"
              style="filter: drop-shadow(0 0 8px rgba(255,122,0,0.7));"/>

        <!-- 六角形チタン装甲コア -->
        <g class="sp-hex-chassis" filter="url(#sp-dropShadowHeavy)">
          <path d="M52,185 L70,175 L70,337 L52,327 Z" fill="#707a8d" stroke="#222630" stroke-width="2"/>
          <path d="M52,185 L70,175 L70,337 L52,327 Z" fill="url(#sp-knurlPattern)"/>
          <path d="M460,185 L442,175 L442,337 L460,327 Z" fill="#707a8d" stroke="#222630" stroke-width="2"/>
          <path d="M460,185 L442,175 L442,337 L460,327 Z" fill="url(#sp-knurlPattern)"/>

          <polygon points="256,34 456,144 456,368 256,478 56,368 56,144"
                   fill="url(#sp-titaniumBevel)" stroke="#11141a" stroke-width="3"/>
          <polygon points="256,50 440,152 440,360 256,462 72,360 72,152"
                   fill="url(#sp-innerChassisGrad)" stroke="#090b0f" stroke-width="2"/>

          <polygon class="sp-hex-orange-trim"
                   points="256,58 432,156 432,356 256,454 80,356 80,156"
                   fill="none" stroke="#ff7a00" stroke-width="4" stroke-linejoin="round"
                   style="filter: drop-shadow(0 0 4px rgba(255,122,0,0.8));"/>

          <!-- 冷媒ブルー発光＆タービン放射 -->
          <g class="sp-turbine-glow" clip-path="url(#sp-hexClip)">
            <circle cx="256" cy="256" r="195" fill="url(#sp-coolantBlueGlow)"/>
            <g opacity="0.45" stroke="#80ebff" stroke-width="10">
              <line x1="256" y1="256" x2="256" y2="50"/>
              <line x1="256" y1="256" x2="360" y2="80"/>
              <line x1="256" y1="256" x2="152" y2="80"/>
              <line x1="256" y1="256" x2="256" y2="462"/>
              <line x1="256" y1="256" x2="360" y2="432"/>
              <line x1="256" y1="256" x2="152" y2="432"/>
            </g>
          </g>

          <!-- 通気ルーバー -->
          <g fill="#0c0f14" stroke="#454d5e" stroke-width="1.5">
            <polygon points="220,90 292,90 315,104 197,104"/>
            <polygon points="175,118 337,118 355,132 157,132"/>
            <polygon points="135,146 377,146 390,160 122,160"/>
            <polygon points="122,352 390,352 377,366 135,366"/>
            <polygon points="157,380 355,380 337,394 175,394"/>
            <polygon points="197,408 315,408 292,422 220,422"/>
          </g>

          <!-- 中央ブラッシュドチタンプレート -->
          <polygon points="90,180 422,180 434,256 422,332 90,332 78,256"
                   fill="url(#sp-brushedMetal)" stroke="#1b2029" stroke-width="3"/>
          <polygon points="90,180 422,180 434,256 422,332 90,332 78,256"
                   fill="url(#sp-hairlinePattern)"/>
          <line x1="94" y1="184" x2="418" y2="184" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
          <line x1="94" y1="329" x2="418" y2="329" stroke="rgba(0,0,0,0.6)" stroke-width="2"/>

          <!-- 精密マイクロ刻印 -->
          <g fill="#1c222d" opacity="0.88">
            <rect x="104" y="190" width="28" height="4" rx="1"/>
            <rect x="104" y="197" width="18" height="3" rx="1"/>
            <circle cx="139" cy="193" r="2.1"/>
            <circle cx="147" cy="193" r="2.1"/>
            <circle cx="155" cy="193" r="2.1"/>
            <rect x="356" y="190" width="16" height="4.5" rx="1"/>
            <rect x="376" y="190" width="26" height="4.5" rx="1"/>
            <text x="356" y="203" font-family="JetBrains Mono, monospace" font-size="7" font-weight="900">SYS-HV07</text>
          </g>

          <!-- 六角穴付きボルト -->
          <g class="sp-bolt sp-bolt-left">
            <circle cx="108" cy="256" r="14" fill="#2c3340" stroke="#7a8496" stroke-width="2"/>
            <polygon points="108,247 116,251.5 116,260.5 108,265 100,260.5 100,251.5" fill="#0d1015"/>
          </g>
          <g class="sp-bolt sp-bolt-right">
            <circle cx="404" cy="256" r="14" fill="#2c3340" stroke="#7a8496" stroke-width="2"/>
            <polygon points="404,247 412,251.5 412,260.5 404,265 396,260.5 396,251.5" fill="#0d1015"/>
          </g>

          <!-- コードフラッシュ ➔ ERRロックテキスト -->
          <g class="sp-err-group" filter="url(#sp-neonOrangeGlow)">
            <text id="splash-hero-text" x="256" y="282"
                  text-anchor="middle"
                  font-family="Chakra Petch, sans-serif"
                  font-size="104"
                  font-weight="900"
                  letter-spacing="4"
                  fill="url(#sp-errFlameGrad)"
                  stroke="#ff6200"
                  stroke-width="2.5">ERR</text>
          </g>

          <text class="sp-sub-stencil" x="256" y="317"
                text-anchor="middle"
                font-family="JetBrains Mono, monospace"
                font-size="13.5"
                font-weight="900"
                letter-spacing="1.6"
                fill="#161a22">DIAGNOSTIC UNIT // HVAC PRO</text>

          <g clip-path="url(#sp-hexClip)">
            <polygon class="sp-metal-sheen" points="0,0 90,0 -30,512 -120,512" fill="url(#sp-sheenGrad)"/>
          </g>
        </g>
      </svg>
    </div>

    <div class="splash-telemetry">
      <div class="splash-telemetry-brand">HVAC ANALYZER</div>
      <div class="splash-bar-track">
        <div class="splash-bar-fill"></div>
      </div>
      <div class="splash-telemetry-status" id="splash-status">BUILDING CHASSIS...</div>
    </div>

    <button type="button" class="splash-skip-btn" id="btn-skip-splash">SKIP ⏭</button>
  </div>

  <div class="app-container">
    <!-- ヘッダー -->
    <header class="app-header">
      <div class="header-main">
        <div class="header-brand">
          <img src="app-icon-header.png" alt="HVAC Analyzer Icon" class="header-app-icon" width="40" height="40">
          <div class="header-title-group">
            <span class="header-badge">HVAC ANALYZER</span>
            <h1 class="header-title">空調エラー即引き</h1>
          </div>
        </div>
        <div class="header-controls">
          <button id="btn-share-tool" class="icon-btn share-btn" title="スマホ間で共有 (QRコード)" aria-label="ツール共有">
            <span>📲 共有</span>
          </button>
          <button id="btn-theme-toggle" class="icon-btn" title="明暗テーマ切替" aria-label="明暗テーマ切替">
            <span id="theme-icon">☀️</span>
          </button>
        </div>
      </div>
      
      <!-- メーカー選択ピルタブ -->
      <nav class="maker-tabs-scroll" aria-label="メーカー選択">
        <div class="maker-tabs" id="maker-tabs-container">
          <!-- JSで動的生成または静的配置 -->
        </div>
      </nav>
    </header>

    <!-- メインコンテンツ -->
    <main class="app-main">
      <!-- 検索入力セクション -->
      <section class="search-section">
        <div class="search-input-wrapper">
          <span class="search-icon">🔍</span>
          <input 
            type="search" 
            id="error-search-input" 
            class="search-input" 
            placeholder="コード入力 (例: A3, U4, P10, E04) または 症状"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            spellcheck="false"
          >
          <button id="btn-clear-search" class="clear-btn" title="入力を消去" style="display: none;">✕</button>
          <button id="btn-toggle-keypad" class="keypad-toggle-btn" title="オンスクリーンキーパッド切替">
            ⌨️ テンキー
          </button>
        </div>

        <!-- 現場特化オンスクリーンキーパッド -->
        <div class="onscreen-keypad hidden" id="onscreen-keypad">
          <div class="keypad-grid" id="keypad-grid">
            <!-- JSでキーを生成 -->
          </div>
        </div>

        <!-- 症状から逆引きドラムピック (超省スペース・ドラムロール選択) -->
        <div class="symptom-drum-wrapper">
          <label for="symptom-drum-select" class="symptom-drum-label">
            <span class="drum-pulse-dot"></span>
            <span>症状ドラム逆引き</span>
          </label>
          <div class="drum-select-container">
            <select id="symptom-drum-select" class="symptom-drum-select" aria-label="症状から逆引きドラムピック">
              <option value="">▼ 症状を選択 (ドラムロールで選ぶ)</option>
              <option value="ドレン">💧 ドレン水漏れ・満水・水位異常</option>
              <option value="ファン">🌪 ファン・送風停止・回転数異常</option>
              <option value="通信">📡 室内外通信・渡り線・伝送エラー</option>
              <option value="高圧">🔥 高圧圧力過昇・室外熱交目詰まり</option>
              <option value="吐出">🌡 吐出ガス温度過昇・過熱運転</option>
              <option value="冷媒">❄ 冷媒ガス漏れ・低圧圧力低下</option>
              <option value="電源">🔌 電源相順・逆相・欠相・電圧異常</option>
              <option value="インバータ">📟 基板・インバータ・IPM短絡破損</option>
              <option value="サーミスタ">📍 センサ・サーミスタ断線/短絡</option>
            </select>
            <button id="btn-clear-symptom" class="btn-clear-symptom hidden" title="症状選択を解除" aria-label="症状解除">✕ 解除</button>
          </div>
        </div>

        <!-- 直近の検索履歴 & お気に入り切替 -->
        <div class="quick-nav-bar">
          <div class="nav-chips" id="recent-chips-container">
            <!-- 履歴チップ -->
          </div>
          <div class="tab-switches">
            <button id="tab-all-results" class="sub-tab-btn active">検索結果 (<span id="result-count">0</span>)</button>
            <button id="tab-favorites" class="sub-tab-btn">⭐ 保存 (<span id="fav-count">0</span>)</button>
          </div>
        </div>
      </section>

      <!-- 検索結果 / カード表示エリア -->
      <section class="results-section" id="results-container">
        <!-- JSでエラーカードを挿入 -->
      </section>
    </main>

    <!-- コピー完了トースト通知 -->
    <div id="toast" class="toast">コピーしました</div>

    <!-- 共有モーダル (QRコード) -->
    <div id="share-modal" class="modal-backdrop" style="display: none;">
      <div class="modal-card">
        <div class="modal-header">
          <div class="modal-title-group">
            <span class="modal-badge">TOOL SHARE</span>
            <h3 class="modal-title">スマホどうしで共有</h3>
          </div>
          <button id="btn-close-modal" class="modal-close-btn" aria-label="閉じる">✕</button>
        </div>
        <div class="modal-body">
          <p class="modal-desc">同僚のスマホカメラで以下のQRコードを読み取ると、すぐにこのツールを開けます。</p>
          
          <div class="qrcode-wrapper">
            <div id="share-qrcode-container" class="qrcode-box"></div>
          </div>

          <div class="url-copy-box">
            <input type="text" id="share-url-input" class="url-input" readonly>
            <button id="btn-copy-url" class="btn-copy-url">コピー</button>
          </div>

          <div class="modal-actions">
            <button id="btn-native-share" class="btn-primary-action">
              📤 共有メニューを開く (LINE/AirDrop等)
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="qrcode.min.js"></script>
  <script src="error-data.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(err => {
          console.log('SW reg failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
